name: Build ALBAZ Lunar Windows x64

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Verify exact audited R2 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'ci/lunar_ci_source_r2.zip'
          if (!(Test-Path $src)) { throw 'Exact audited R2 ZIP is missing' }
          $hash = (Get-FileHash $src -Algorithm SHA256).Hash.ToLower()
          Write-Host "R2_SOURCE_SHA256=$hash"
          if ($hash -ne 'b84df5ed9f546759f8b7a75587fe55c4ad5e1dad93d5298207d40164c342ec8f') {
            throw "Exact audited R2 SHA256 mismatch: $hash"
          }
          if (Test-Path lunar_build) { Remove-Item lunar_build -Recurse -Force }
          Expand-Archive $src -DestinationPath lunar_build -Force
          if (!(Test-Path 'lunar_build/lunar_bootstrap.py')) { throw 'lunar_bootstrap.py missing from R2 source' }
          if (!(Test-Path 'lunar_build/lunar_main.py')) { throw 'lunar_main.py missing from R2 source' }

      - name: Install build dependencies
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install numpy scipy PySide6 pytest nuitka ordered-set zstandard tzdata==2026.3

      - name: Download official DE440 and IERS data
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force data | Out-Null
          curl.exe -L --retry 5 --retry-delay 3 --fail "https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440.bsp" -o "data/de440.bsp"
          if ($LASTEXITCODE -ne 0) { throw 'DE440 download failed' }
          curl.exe -L --retry 5 --retry-delay 3 --fail "https://maia.usno.navy.mil/ser7/finals2000A.all" -o "data/finals2000A.all"
          if ($LASTEXITCODE -ne 0) { throw 'IERS download failed' }
          if ((Get-Item 'data/de440.bsp').Length -ne 119799808) { throw "Unexpected DE440 byte size: $((Get-Item 'data/de440.bsp').Length)" }
          if ((Get-Item 'data/finals2000A.all').Length -lt 1MB) { throw 'IERS file is unexpectedly small' }
          Write-Host "DE440 bytes=$((Get-Item 'data/de440.bsp').Length)"
          Write-Host "IERS bytes=$((Get-Item 'data/finals2000A.all').Length)"

      - name: Build full GeoNames city database
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = (Get-Location).Path
          python scripts/fetch_geonames_lunar.py --cache-dir .geonames-cache --output data/world_cities.sqlite3
          if ($LASTEXITCODE -ne 0) { throw 'GeoNames database build failed' }
          if (!(Test-Path 'data/world_cities.sqlite3')) { throw 'City database not created' }

      - name: Download NASA world map asset
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force assets/images | Out-Null
          curl.exe -L --retry 5 --retry-delay 3 --fail "https://svs.gsfc.nasa.gov/vis/a000000/a002900/a002915/bluemarble-2048.png" -o "assets/images/world_map_premium_clean.png"
          if ($LASTEXITCODE -ne 0) { throw 'NASA map download failed' }
          if ((Get-Item 'assets/images/world_map_premium_clean.png').Length -lt 1MB) { throw 'NASA map asset is unexpectedly small' }

      - name: Run release preflight
        working-directory: lunar_build
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          python lunar_release_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'Lunar release preflight failed' }

      - name: Run complete lunar test suite
        working-directory: lunar_build
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Complete lunar test suite failed' }

      - name: Run expanded DE440 NASA regression
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python lunar_scientific_regression.py
          if ($LASTEXITCODE -ne 0) { throw 'Expanded lunar scientific regression failed' }

      - name: Source runtime smoke test through bootstrap
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:ALBAZ_LUNAR_RUNTIME_SMOKE = '1'
          $ok = Join-Path $env:TEMP 'ALBAZ_LUNAR_RUNTIME_SMOKE_OK.json'
          $fail = Join-Path $env:TEMP 'ALBAZ_LUNAR_RUNTIME_SMOKE_FAILED.txt'
          Remove-Item $ok,$fail -Force -ErrorAction SilentlyContinue
          python lunar_bootstrap.py
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $fail) { Get-Content $fail }
            throw "Source runtime smoke failed with code $LASTEXITCODE"
          }
          if (!(Test-Path $ok)) { throw 'Source runtime smoke success marker missing' }
          Get-Content $ok

      - name: Build standalone Windows EXE with Nuitka
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --msvc=latest `
            --windows-console-mode=disable `
            --output-dir=dist `
            --output-filename=ALBAZ_LUNAR_ECLIPSE_ATLAS.exe `
            --include-data-dir=assets=assets `
            --include-package-data=tzdata `
            --include-data-file=data/de440.bsp=data/de440.bsp `
            --include-data-file=data/finals2000A.all=data/finals2000A.all `
            --include-data-file=data/world_cities.sqlite3=data/world_cities.sqlite3 `
            lunar_bootstrap.py
          if ($LASTEXITCODE -ne 0) { throw 'Nuitka build failed' }

      - name: Verify packaged runtime contents
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Get-ChildItem -Path dist -Directory -Filter '*.dist' | Select-Object -First 1
          if (!$dist) { throw 'Nuitka standalone dist directory missing' }
          $exe = Join-Path $dist.FullName 'ALBAZ_LUNAR_ECLIPSE_ATLAS.exe'
          if (!(Test-Path $exe)) { throw 'Packaged EXE missing' }
          if (!(Test-Path (Join-Path $dist.FullName 'data/de440.bsp'))) { throw 'Packaged DE440 missing' }
          if ((Get-Item (Join-Path $dist.FullName 'data/de440.bsp')).Length -ne 119799808) { throw 'Packaged DE440 size mismatch' }
          if (!(Test-Path (Join-Path $dist.FullName 'data/finals2000A.all'))) { throw 'Packaged IERS missing' }
          if (!(Test-Path (Join-Path $dist.FullName 'data/world_cities.sqlite3'))) { throw 'Packaged cities DB missing' }
          Write-Host "PACKAGED_DIST=$($dist.FullName)"

      - name: Smoke-test the actual packaged EXE
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $exe = Get-ChildItem -Path dist -Recurse -Filter 'ALBAZ_LUNAR_ECLIPSE_ATLAS.exe' | Select-Object -First 1
          if (!$exe) { throw 'Packaged EXE not found' }
          Write-Host "Testing EXE: $($exe.FullName)"
          $pythonExe = (Get-Command python).Source
          $savedPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $pythonExe scripts/lunar_runtime_smoke.py "$($exe.FullName)" --timeout 180
          $smokeCode = $LASTEXITCODE
          $env:PATH = $savedPath
          if ($smokeCode -ne 0) {
            $startup = Join-Path $env:TEMP 'ALBAZ_LUNAR_STARTUP_FAILED.txt'
            $runtime = Join-Path $env:TEMP 'ALBAZ_LUNAR_RUNTIME_SMOKE_FAILED.txt'
            if (Test-Path $startup) { Get-Content $startup }
            if (Test-Path $runtime) { Get-Content $runtime }
            throw "Packaged EXE runtime smoke failed with code $smokeCode"
          }
          "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DIST_DIR=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: GUI startup liveness smoke
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          Remove-Item Env:ALBAZ_LUNAR_RUNTIME_SMOKE -ErrorAction SilentlyContinue
          $startup = Join-Path $env:TEMP 'ALBAZ_LUNAR_STARTUP_FAILED.txt'
          Remove-Item $startup -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $env:EXE_PATH -WorkingDirectory $env:DIST_DIR -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            if (Test-Path $startup) { Get-Content $startup }
            throw "GUI EXE exited during 10-second liveness smoke with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'GUI_LIVENESS_SMOKE=PASS'

      - name: Create portable Windows package
        working-directory: lunar_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path $env:EXE_PATH)) { throw 'Verified EXE path missing' }
          $dist = $env:DIST_DIR
          @'
          @echo off
          cd /d "%~dp0"
          start "" "ALBAZ_LUNAR_ECLIPSE_ATLAS.exe"
          '@ | Set-Content (Join-Path $dist 'START_ALBAZ_LUNAR.cmd') -Encoding ASCII
          @'
          ALBAZ LUNAR ECLIPSE ATLAS v9.6.3 TESLA FINAL
          Windows x64 Portable / Offline runtime.
          Run START_ALBAZ_LUNAR.cmd or ALBAZ_LUNAR_ECLIPSE_ATLAS.exe.
          Python, pip and an Internet connection are NOT required to run the packaged application.
          Scientific engine: JPL DE440 + IERS EOP + Danjon 1.01 lunar-shadow geometry.
          Release audit: 64-test suite + expanded NASA regression + packaged runtime smoke + GUI liveness smoke.
          '@ | Set-Content (Join-Path $dist 'README.txt') -Encoding UTF8
          $zip = 'ALBAZ_LUNAR_ECLIPSE_ATLAS_v9.6.3_TESLA_FINAL_WINDOWS_x64_PORTABLE.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$dist\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ASCII
          Write-Host "portable_sha256=$hash"
          Get-Item $zip | Format-List Name,Length,FullName

      - name: Upload verified Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALBAZ-LUNAR-WINDOWS-x64-PORTABLE
          path: |
            lunar_build/ALBAZ_LUNAR_ECLIPSE_ATLAS_v9.6.3_TESLA_FINAL_WINDOWS_x64_PORTABLE.zip
            lunar_build/ALBAZ_LUNAR_ECLIPSE_ATLAS_v9.6.3_TESLA_FINAL_WINDOWS_x64_PORTABLE.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
