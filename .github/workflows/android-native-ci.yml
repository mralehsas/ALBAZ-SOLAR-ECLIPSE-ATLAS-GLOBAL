name: Android Native CI

on:
  push:
    branches:
      - android-native-scientific-edition
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify native project structure
        run: python android-native/verify_project.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Discover Gradle projects
        working-directory: android-native
        run: gradle projects
      - name: Run core-time tests
        working-directory: android-native
        run: gradle :core-time:test --tests '*CivilCalendarTest*'
